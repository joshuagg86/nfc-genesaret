<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoservicio | Genesaret</title><style>
*{box-sizing:border-box}body{margin:0;background:#071c2c;color:#eaf4ff;font:16px system-ui,sans-serif}header,main{max-width:1400px;margin:auto;padding:20px clamp(16px,4vw,40px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1,h2{margin:0 0 12px}small,p{color:#a9c0d1}button,select,input,a{font:inherit}button,select,input,.back{background:#15354c;border:1px solid #36556b;border-radius:12px;padding:12px;color:#f4faff}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.back{text-decoration:none}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,155px),1fr));gap:12px}.product,.cart{background:#102d43;border:1px solid #31546d;border-radius:18px;padding:16px}.product{display:grid;gap:9px;text-align:left}.product strong{font-size:18px}.product span{color:#8bd5ff}.cart{align-self:start;position:sticky;top:12px}.line{padding:12px 0;border-bottom:1px solid #31546d;display:grid;gap:8px}.controls{display:flex;align-items:center;gap:12px}.total{font-size:26px;font-weight:800;margin:16px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:150px}.primary{background:#1477c9;width:100%;font-weight:700}.notice{font-size:14px}#status.error{color:#ffc1b9}@media(max-width:680px){.layout{grid-template-columns:1fr}.cart{position:static}}
</style></head><body><header><div><small>GENESARET POS</small><h1>Arma tu pedido</h1></div><a class="back" href="admin.html">Volver al panel</a></header><main><p id="status" role="status">Verificando acceso…</p><div class="toolbar"><select id="event" aria-label="Evento" disabled></select><input id="search" placeholder="Buscar producto" aria-label="Buscar producto" disabled></div><div class="layout"><section><h2>Menú</h2><div id="products" class="grid"></div></section><aside class="cart"><h2>Tu pedido</h2><div id="cart"></div><div id="total" class="total">$0.00</div><button id="send" class="primary" disabled>Enviar a Caja</button><p class="notice" id="notice">Vista de prueba. El envío a Caja requiere habilitar la conexión segura en Firebase.</p></aside></div></main><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><script src="config.js"></script><script src="self-service.js?v=1"></script></body></html>
